site_name: mcquerol | Projects
site_description: Repository READMEs and project documentation by Mateo Ceballos Querol
site_url: https://mcquerol.github.io/docs/
repo_url: https://github.com/mcquerol
repo_name: mcquerol
edit_uri: ""

docs_dir: docs-source
site_dir: docs

theme:
  name: readthedocs
  locale: en
  highlightjs: true
  hljs_languages:
    - cpp
    - python
    - bash
  navigation_depth: 2
  collapse_navigation: false
  sticky_navigation: true
  include_homepage_in_sidebar: false
  prev_next_buttons_location: bottom

nav: []

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

copyright: Copyright &copy; 2026 Mateo Ceballos Querol
